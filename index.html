<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKSARA-APLIKASI KELAS DAN SISTEM ADMINISTRASI REKAM AKADEMIK</title>
    
    <!-- Konfigurasi PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://i.ibb.co.com/mCSMP2TP/LOGO-AKSARA.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #F8FAFC; font-family: 'Montserrat', sans-serif; }
        
        /* Layar pemuatan awal yang elegan */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #E2E8F0;
            border-top: 4px solid #00A39D;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Bingkai aplikasi utama yang memenuhi layar */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Animasi loading saat pertama kali dibuka -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h3 style="color: #1E293B; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em;">WELCOME TO AKSARA</h3>
        <p style="color: #64748B; font-size: 11px; margin-top: 4px;">Aplikasi Kelas dan Sistem Administrasi Rekam Akademik</p>
    </div>

    <!-- Memuat seluruh sistem aplikasi Google Apps Script secara transparan -->
    <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbwgK7WPO4xPOmTUrwjYwKTfNx2g7dK8hwImo5nKpAaZE7h9aWPGrctunDNKE75LOiI/exec" 
            onload="document.getElementById('loading-screen').style.opacity='0'; setTimeout(()=>document.getElementById('loading-screen').style.display='none', 400);"
            allow="fullscreen; camera; microphone; clipboard-read; clipboard-write">
    </iframe>

    <!-- Script Registrasi Service Worker PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('PWA ServiceWorker berhasil didaftarkan. Scope:', registration.scope);
                    })
                    .catch((error) => {
                        console.error('Registrasi PWA ServiceWorker gagal:', error);
                    });
            });
        }
    </script>
</body>
</html>
