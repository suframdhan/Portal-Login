<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKSARA - Aplikasi Kelas dan Sistem Administrasi Rekam Akademik</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Konfigurasi PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://i.ibb.co.com/mCSMP2TP/LOGO-AKSARA.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #F8FAFC; 
            font-family: 'Montserrat', sans-serif; 
        }
        
        /* Layar pemuatan Full Video */
        #loading-screen {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            z-index: 999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #loading-screen video {
    width: 80%; /* Membuat ukuran responsif di HP */
    max-width: 500px; /* Membatasi ukuran maksimal agar tidak terlalu besar di PC */
    height: auto;
    object-fit: contain; /* Memastikan seluruh bagian video terlihat tanpa terpotong */
}
        
        /* Bingkai aplikasi utama yang memenuhi layar */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Animasi loading full video -->
    <div id="loading-screen">
        <video autoplay loop muted playsinline>
            <source src="https://raw.githubusercontent.com/suframdhan/Portal-Login/refs/heads/main/AKSARA.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Memuat seluruh sistem aplikasi Google Apps Script secara transparan -->
    <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbxrk0YkQO17s35uMeaLA3WsyZg-d35BEbp9sxA6qcT7BsCTWZNIB-21EpGHPy5tZOlQ/exec" 
            onload="const screen = document.getElementById('loading-screen'); screen.style.opacity='0'; setTimeout(()=>screen.style.visibility='hidden', 500);"
            allow="fullscreen; camera; microphone; clipboard-read; clipboard-write">
    </iframe>

    <!-- Script Registrasi Service Worker PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('PWA ServiceWorker berhasil didaftarkan. Scope:', registration.scope);
                    })
                    .catch((error) => {
                        console.error('Registrasi PWA ServiceWorker gagal:', error);
                    });
            });
        }
    </script>
</body>
</html>
