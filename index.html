<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKSARA - Aplikasi Kelas dan Sistem Administrasi Rekam Akademik</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Konfigurasi PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://i.ibb.co.com/mCSMP2TP/LOGO-AKSARA.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #F8FAFC; 
            font-family: 'Montserrat', sans-serif; 
        }
        
        /* Layar pemuatan awal yang elegan */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #F8FAFC 0%, #E6F6F5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-card {
            background: white;
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 163, 158, 0.08);
            border: 1px solid rgba(0, 163, 158, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 360px;
            width: 90%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .logo-container {
            width: 72px;
            height: 72px;
            background: #E6F6F5;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 163, 158, 0.2);
            box-shadow: 0 4px 12px rgba(0, 163, 158, 0.1);
        }

        .logo-container img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .spinner-wrapper {
            position: relative;
            width: 50px;
            height: 50px;
            margin-bottom: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #E2E8F0;
            border-top: 4px solid #00A39D;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        h3 {
            color: #1E293B;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .desc {
            color: #64748B;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.4;
        }

        /* Bar progres halus di bawah kartu */
        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #E2E8F0;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00A39D, #F5A623);
            animation: progressPulse 2s ease-in-out infinite;
        }

        @keyframes progressPulse {
            0% { width: 10%; }
            50% { width: 75%; }
            100% { width: 95%; }
        }
        
        /* Bingkai aplikasi utama yang memenuhi layar */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Animasi loading estetik saat pertama kali dibuka -->
    <div id="loading-screen">
        <div class="loading-card">
            <div class="logo-container">
                <img src="https://i.ibb.co.com/mCSMP2TP/LOGO-AKSARA.png" alt="Logo AKSARA">
            </div>
            
            <div class="spinner-wrapper">
                <div class="spinner"></div>
            </div>

            <h3>WELCOME TO AKSARA</h3>
            <p class="desc">Aplikasi Kelas dan Sistem Administrasi Rekam Akademik</p>

            <div class="progress-bar-container">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- Memuat seluruh sistem aplikasi Google Apps Script secara transparan -->
    <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbyBaROhu-R8BTHoUsrT0snzlpPTW_dRqev9ZWb-EK1CrUJFMb7lc2XO9IfRuDJxJF4I/exec" 
            onload="const screen = document.getElementById('loading-screen'); screen.style.opacity='0'; setTimeout(()=>screen.style.visibility='hidden', 500);"
            allow="fullscreen; camera; microphone; clipboard-read; clipboard-write">
    </iframe>

    <!-- Script Registrasi Service Worker PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('PWA ServiceWorker berhasil didaftarkan. Scope:', registration.scope);
                    })
                    .catch((error) => {
                        console.error('Registrasi PWA ServiceWorker gagal:', error);
                    });
            });
        }
    </script>
</body>
</html>
