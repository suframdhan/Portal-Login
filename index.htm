        tailwind.config = {

    <style>
        .fade-in-up { opacity: 0; animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        
        .shine-effect { position: relative; overflow: hidden; }
        .shine-effect::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg); transition: left 0.75s cubic-bezier(0.19, 1, 0.22, 1); z-index: 20; pointer-events: none;
        }
        .portal-card:hover .shine-effect::before { left: 125%; }
        .portal-card { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .portal-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px -12px rgba(13, 148, 136, 0.25); }
    </style>
